name: codegen

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codegen

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: ops/go.mod
          cache: false

      - name: Run codegen
        working-directory: ops
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
        run: go run ./cmd/codegen/main.go --l1-rpc-urls "$SEPOLIA_RPC_URL,$MAINNET_RPC_URL"

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          git status --porcelain
          if [ -n "$(git status --porcelain -- superchain/extra/addresses/addresses.json chainList.json chainList.toml)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated files
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codegen
          path: |
            superchain/extra/addresses/addresses.json
            chainList.json
            chainList.toml
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: codegen
    permissions:
      id-token: write
    steps:
      - name: Download generated files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codegen
          path: ${{ runner.temp }}/codegen

      - name: Open pull request
        shell: bash
        env:
          STS_URL: ${{ vars.STS_URL }}
          STS_AUDIENCE: ${{ vars.STS_AUDIENCE }}
        run: |
          set -euo pipefail

          api="https://api.github.com"
          repo="$GITHUB_REPOSITORY"
          max_bytes=5242880
          allowed=(
            "superchain/extra/addresses/addresses.json"
            "chainList.json"
            "chainList.toml"
          )

          cd "$RUNNER_TEMP/codegen"

          while IFS= read -r -d '' entry; do
            match=false
            for path in "${allowed[@]}"; do
              if [ "${entry#./}" = "$path" ]; then
                match=true
              fi
            done
            if [ "$match" != true ]; then
              echo "::error::artifact contains an entry outside the allowlist"
              exit 1
            fi
          done < <(find . -mindepth 1 ! -type d -print0)

          for path in "${allowed[@]}"; do
            if [ ! -f "$path" ] || [ -L "$path" ]; then
              echo "::error::$path is missing from the artifact or is not a regular file"
              exit 1
            fi
            size=$(wc -c < "$path")
            if [ "$size" -eq 0 ] || [ "$size" -gt "$max_bytes" ]; then
              echo "::error::$path has an unexpected size of $size bytes"
              exit 1
            fi
            case "$path" in
              *.json) jq empty "$path" ;;
            esac
          done

          if [ -z "$STS_URL" ] || [ -z "$STS_AUDIENCE" ]; then
            echo "::error::the STS_URL and STS_AUDIENCE repository variables must be set"
            exit 1
          fi

          audience=$(jq -rn --arg v "$STS_AUDIENCE" '$v | @uri')
          oidc_token=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$audience" | jq -r '.value // empty')
          if [ -z "$oidc_token" ]; then
            echo "::error::could not obtain an OIDC token"
            exit 1
          fi
          echo "::add-mask::$oidc_token"

          token=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $oidc_token" \
            "${STS_URL%/}/sts/exchange?scope=ethereum-optimism&identity=superchain-registry-codegen" | jq -r '.token // empty')
          unset oidc_token
          if [ -z "$token" ]; then
            echo "::error::token exchange returned no token"
            exit 1
          fi
          echo "::add-mask::$token"

          work=$(mktemp -d)
          cleanup() {
            curl -sS -o /dev/null -X DELETE \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api/installation/token" || true
            rm -rf "$work"
          }
          trap cleanup EXIT

          gh_api() {
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "$@"
          }

          head_sha=$(gh_api "$api/repos/$repo/git/ref/heads/main" | jq -r '.object.sha')
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            echo "::warning::main moved from $GITHUB_SHA to $head_sha after the files were generated, skipping"
            exit 0
          fi

          echo '[]' > "$work/additions.json"
          for path in "${allowed[@]}"; do
            remote_sha=$(gh_api "$api/repos/$repo/contents/$path?ref=$head_sha" | jq -r '.sha')
            local_sha=$(git hash-object --no-filters "$path")
            if [ "$local_sha" = "$remote_sha" ]; then
              echo "$path is unchanged"
              continue
            fi
            echo "$path changed"
            base64 -w0 "$path" > "$work/contents.b64"
            jq -c --arg path "$path" --rawfile contents "$work/contents.b64" \
              '. + [{path: $path, contents: $contents}]' "$work/additions.json" > "$work/additions.next.json"
            mv "$work/additions.next.json" "$work/additions.json"
          done

          if [ "$(jq 'length' "$work/additions.json")" -eq 0 ]; then
            echo "Generated files match main, nothing to publish"
            exit 0
          fi

          today=$(date -u +%Y-%m-%d)
          branch="automated-codegen-$(date -u +%Y%m%d-%H%M%S)"

          jq -n --arg ref "refs/heads/$branch" --arg sha "$head_sha" '{ref: $ref, sha: $sha}' \
            | gh_api -X POST "$api/repos/$repo/git/refs" --data-binary @- > /dev/null
          echo "Created branch $branch at $head_sha"

          jq -n \
            --arg query 'mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }' \
            --arg repo "$repo" \
            --arg branch "$branch" \
            --arg sha "$head_sha" \
            --arg headline "chore: automated daily codegen update $today" \
            --slurpfile additions "$work/additions.json" \
            '{query: $query, variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch}, message: {headline: $headline}, expectedHeadOid: $sha, fileChanges: {additions: $additions[0]}}}}' \
            > "$work/commit.json"
          gh_api -X POST "$api/graphql" --data-binary "@$work/commit.json" > "$work/commit.response.json"
          commit_oid=$(jq -r '.data.createCommitOnBranch.commit.oid // empty' "$work/commit.response.json")
          if [ -z "$commit_oid" ]; then
            echo "::error::failed to create the commit on $branch"
            jq -c '.errors' "$work/commit.response.json"
            gh_api -X DELETE "$api/repos/$repo/git/refs/heads/$branch" > /dev/null || true
            exit 1
          fi
          echo "Created commit $commit_oid"

          body=$(cat <<'BODY'
          This is an automated PR created by the codegen workflow.

          Please review and merge if the changes look correct.

          Note that only these files should have been modified:

          - [addresses.json](https://github.com/ethereum-optimism/superchain-registry/blob/main/superchain/extra/addresses/addresses.json)
          - [chainList.json](https://github.com/ethereum-optimism/superchain-registry/blob/main/chainList.json)
          - [chainList.toml](https://github.com/ethereum-optimism/superchain-registry/blob/main/chainList.toml)

          For more details see the [runbook](https://www.notion.so/oplabs/superchain-registry-daily-codegen-294f153ee162803788cdee48ec542ca4?v=d784200583d9415587c4dcd2b0c64b2f).
          BODY
          )

          jq -n \
            --arg title "chore: automated codegen update $today" \
            --arg body "$body" \
            --arg head "$branch" \
            '{title: $title, body: $body, head: $head, base: "main"}' \
            | gh_api -X POST "$api/repos/$repo/pulls" --data-binary @- > "$work/pr.response.json"
          pr_url=$(jq -r '.html_url // empty' "$work/pr.response.json")
          if [ -z "$pr_url" ]; then
            echo "::error::failed to create the pull request"
            exit 1
          fi
          echo "PR created: $pr_url"
